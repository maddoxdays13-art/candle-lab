name: Live logger

# Watchdog + manual logger. The "Live keeper" workflow does the logging every
# 15 minutes; whenever GitHub runs this schedule, it makes sure the keeper is
# alive and restarts it if not. Running this by hand logs once right away.
on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

concurrency:
  group: live-logger
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

env:
  PYTHONUNBUFFERED: "1"
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # private channel for phone alerts (ntfy app)

jobs:
  watchdog:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restart the keeper if it is not running
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          active=$(gh run list --workflow live-keeper.yml --limit 5 --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$active" = "0" ]; then
            echo "Keeper not running - starting it."
            gh workflow run live-keeper.yml --ref "${GITHUB_REF_NAME}"
          else
            echo "Keeper is running."
          fi

  log:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Score past predictions and predict the current candle
        run: python -m candlelab.live
      - name: Commit results
        run: |
          scripts/commit_and_push.sh "live: $(date -u +'%Y-%m-%d %H:%M') UTC" results/live docs/data/live.json
